name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - name: Verify native dependencies fit the managed Linux ABI
        run: python3 scripts/check_native_abi.py
      - name: Call the packaged API over HTTP including its real 80-second response
        run: python3 scripts/http_smoke.py
